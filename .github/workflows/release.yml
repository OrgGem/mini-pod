name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for archive filenames when triggered manually (e.g. v0.1.0-rc2)"
        required: false
        default: "dev"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-host:
    name: Host Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin_ext: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            bin_ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin_ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin_ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries (sandboxd, sandbox-cli, bundle-pack)
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }} \
            -p sandboxd \
            -p sandbox-cli \
            -p sandbox-image \
            --bins

      - name: Smoke-test host binaries on native architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN_EXT: ${{ matrix.bin_ext }}
        run: |
          set -euo pipefail
          case "$TARGET:$(uname -m)" in
            x86_64-apple-darwin:x86_64|aarch64-apple-darwin:arm64) ;;
            *-apple-darwin:*) echo "Skipping non-native macOS target $TARGET"; exit 0 ;;
          esac
          "target/$TARGET/release/sandbox-cli$BIN_EXT" --help
          "target/$TARGET/release/sandboxd$BIN_EXT" --help

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION:-dev}"
          fi
          STAGE_DIR="mini-pod-${VERSION}-${TARGET}"
          mkdir -p "${STAGE_DIR}" dist
          cp "target/${TARGET}/release/sandboxd" "${STAGE_DIR}/"
          cp "target/${TARGET}/release/sandbox-cli" "${STAGE_DIR}/"
          cp "target/${TARGET}/release/bundle-pack" "${STAGE_DIR}/"
          chmod 0755 "${STAGE_DIR}/sandboxd" "${STAGE_DIR}/sandbox-cli" "${STAGE_DIR}/bundle-pack"
          cp README.md BRD.md docs/release-candidate-v0.1.0.md "${STAGE_DIR}/"

          ARCHIVE_NAME="${STAGE_DIR}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" "${STAGE_DIR}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            else
              shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            fi
          )

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $Version = $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $Version = $env:INPUT_VERSION
          } else {
            $Version = "dev"
          }
          $StageDir = "mini-pod-$Version-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Copy-Item "target\$env:TARGET\release\sandboxd.exe" "$StageDir\"
          Copy-Item "target\$env:TARGET\release\sandbox-cli.exe" "$StageDir\"
          Copy-Item "target\$env:TARGET\release\bundle-pack.exe" "$StageDir\"
          Copy-Item "README.md", "BRD.md", "docs\release-candidate-v0.1.0.md" "$StageDir\"

          $ArchiveName = "$StageDir.zip"
          $ArchivePath = Join-Path "dist" $ArchiveName
          Compress-Archive -Path $StageDir -DestinationPath $ArchivePath -Force

          $Hash = (Get-FileHash -Algorithm SHA256 $ArchivePath).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "$ArchivePath.sha256",
            "$Hash  $ArchiveName`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Upload host release artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-npm-main:
    name: Build npm main package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test npm packaging
        run: node --test npm/test/*.test.js
      - name: Check workspace and npm versions
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 | node -e '
            let json = "";
            process.stdin.on("data", chunk => json += chunk);
            process.stdin.on("end", () => {
              const metadata = JSON.parse(json);
              const versions = ["sandbox-cli", "sandboxd"].map(name => metadata.packages.find(pkg => pkg.name === name)?.version);
              const expected = require("./npm/package.json").version;
              if (versions.some(version => version !== expected)) {
                console.error(`npm version ${expected} does not match Rust package versions ${versions.join(", ")}`);
                process.exitCode = 1;
              }
            });'
      - name: Stage and pack main package
        shell: bash
        env:
          VERSION_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version || 'dev' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "process.argv[1] === 'dev' ? require('./npm/package.json').version + '-dev' : process.argv[1].replace(/^v/, '')" "$VERSION_LABEL")"
          mkdir -p npm-stage npm-dist
          node npm/scripts/stage.js main "$VERSION" npm-stage/main
          npm pack ./npm-stage/main --pack-destination ./npm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-main
          path: npm-dist/*.tgz
          if-no-files-found: error

  build-npm-platform:
    name: Build npm platform package (${{ matrix.target }})
    needs: [build-host, build-npm-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: host-artifact
      - name: Stage and pack platform package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.version || 'dev' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "process.argv[1] === 'dev' ? require('./npm/package.json').version + '-dev' : process.argv[1].replace(/^v/, '')" "$VERSION_LABEL")"
          mkdir -p extracted npm-stage npm-dist
          shopt -s nullglob
          archives=(host-artifact/*.zip host-artifact/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected one host archive for ${TARGET}" >&2
            exit 1
          fi
          checksums=(host-artifact/*.sha256)
          if [ "${#checksums[@]}" -ne 1 ]; then
            echo "Expected one host checksum for ${TARGET}" >&2
            exit 1
          fi
          (cd host-artifact && sha256sum -c "$(basename "${checksums[0]}")")
          if [[ "${archives[0]}" == *.zip ]]; then
            unzip -q "${archives[0]}" -d extracted
          else
            tar -xzf "${archives[0]}" -C extracted
          fi
          directories=(extracted/*/)
          if [ "${#directories[@]}" -ne 1 ]; then
            echo "Expected one host archive directory for ${TARGET}" >&2
            exit 1
          fi
          node npm/scripts/stage.js "$TARGET" "$VERSION" npm-stage/platform "${directories[0]}"
          npm pack ./npm-stage/platform --pack-destination ./npm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-platform-${{ matrix.target }}
          path: npm-dist/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    needs: [build-npm-main, build-npm-platform]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-artifacts
      - name: Publish platform packages, then main package
        shell: bash
        env:
          VERSION_LABEL: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG=latest
          if [[ "$VERSION_LABEL" == *-* ]]; then TAG=next; fi
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            packages=("npm-artifacts/npm-platform-${target}/"*.tgz)
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "Expected one npm artifact for ${target}" >&2
              exit 1
            fi
            npm publish "${packages[0]}" --access public --tag "$TAG"
          done
          packages=(npm-artifacts/npm-main/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected one npm main artifact" >&2
            exit 1
          fi
          npm publish "${packages[0]}" --access public --tag "$TAG"

  build-guest-linux-musl:
    name: Guest Static Musl Binaries (${{ matrix.guest_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest_arch: x86_64
            os: ubuntu-latest
            platform: linux/amd64
          - guest_arch: aarch64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static musl tiny-init and sandbox-agent in pinned rust:alpine
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GUEST_ARCH: ${{ matrix.guest_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION:-dev}"
          fi
          STAGE_DIR="mini-pod-guest-bins-${VERSION}-${GUEST_ARCH}-linux-musl"
          mkdir -p "${STAGE_DIR}" dist
          chmod 0777 "${STAGE_DIR}"

          docker run --rm --platform "${PLATFORM}" \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/${STAGE_DIR}:/out" \
            rust:alpine@sha256:2cccd8b212b37dad15a555589c1b6787da4ab913fe24d8a9b2d99d3498869409 \
            sh -euxc '
              apk add --no-cache musl-dev file binutils >/dev/null
              RUSTFLAGS="-C target-feature=+crt-static -C link-self-contained=yes -C link-arg=-Wl,--build-id=none" \
                cargo build --manifest-path /src/Cargo.toml --locked \
                --profile guest-release \
                -p tiny-init \
                -p sandbox-agent \
                --target-dir /tmp/cargo-target
              cp /tmp/cargo-target/guest-release/tiny-init /out/tiny-init
              cp /tmp/cargo-target/guest-release/sandbox-agent /out/sandbox-agent
              chmod 0755 /out/tiny-init /out/sandbox-agent
              file /out/tiny-init /out/sandbox-agent
              for bin in /out/tiny-init /out/sandbox-agent; do
                if readelf -d "$bin" 2>/dev/null | grep -Eq '\(NEEDED\)'; then
                  echo "ERROR: $bin has dynamic NEEDED dependencies" >&2
                  exit 1
                fi
                if readelf -l "$bin" | grep -Eq 'INTERP|Requesting program interpreter'; then
                  echo "ERROR: $bin has a dynamic program interpreter" >&2
                  exit 1
                fi
              done
            '

          ARCHIVE_NAME="${STAGE_DIR}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" "${STAGE_DIR}"
          (
            cd dist
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          )

      - name: Upload guest musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.guest_arch }}-linux-musl
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-host
      - build-guest-linux-musl
      - build-npm-main
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download host release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: release-assets
          merge-multiple: true

      - name: Download guest release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: guest-*
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
