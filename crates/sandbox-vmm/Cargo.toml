[package]
name = "sandbox-vmm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
sandbox-core = { workspace = true }
sandbox-protocol = { workspace = true }
sandbox-runtime = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
bollard = { version = "0.17", default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sandbox-docker-compat = { workspace = true }
sandbox-image = { workspace = true }
tar = { workspace = true }
testcontainers = { version = "0.23", default-features = false }
